/* ---------------------------------------------------------------------- */
/* Encryption: primitives, keyring, record envelope, data-access layer     */
/* See plans/encryption.md for the full design.                            */
/* ---------------------------------------------------------------------- */
const PBKDF2_ITERATIONS = 600000;
const KDF_ALG = 'PBKDF2-SHA256';
const MS_AAD = new TextEncoder().encode('calyx-ms');

// Chunked to avoid "Maximum call stack size exceeded" from spreading large
// typed arrays into String.fromCharCode's argument list (browser call-stack
// limits are typically far below the size of a large chat message/file).
function b64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}
function unb64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)).buffer; }
function randomBytes(n) { return crypto.getRandomValues(new Uint8Array(n)); }

const CROCKFORD_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function base32Encode(bytes) {
  let bits = 0, value = 0, out = '';
  for (const byte of bytes) {
    value = (value << 8) | byte; bits += 8;
    while (bits >= 5) { out += CROCKFORD_ALPHABET[(value >>> (bits - 5)) & 31]; bits -= 5; }
  }
  if (bits > 0) out += CROCKFORD_ALPHABET[(value << (5 - bits)) & 31];
  return out;
}
function generateRecoveryKey() {
  return base32Encode(randomBytes(16)).match(/.{1,4}/g).join('-');
}

async function deriveKekFromSecret(secret, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function importMasterSecret(rawBytes) {
  return crypto.subtle.importKey('raw', rawBytes, 'HKDF', false, ['deriveKey']);
}
async function deriveFromMaster(baseKey, info, alg) {
  return crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode(info) },
    baseKey, alg === 'HMAC' ? { name: 'HMAC', hash: 'SHA-256' } : { name: 'AES-GCM', length: 256 },
    false, alg === 'HMAC' ? ['sign'] : ['encrypt', 'decrypt']
  );
}
async function aesEncrypt(key, plaintextBytes, aad) {
  const iv = randomBytes(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, plaintextBytes);
  return { iv: b64(iv), ct: b64(ct) };
}
async function aesDecrypt(key, ivB64, ctB64, aad) {
  const iv = new Uint8Array(unb64(ivB64));
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, unb64(ctB64));
}
async function hmacHex(key, text) {
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(text));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---- Vault runtime state (in-memory only; never persisted) ---- */
const VAULT = { unlocked: false, kid: null, dataKey: null, hmacKey: null, exportKey: null };

async function deriveVaultKeys(msBytes, kid) {
  const base = await importMasterSecret(msBytes);
  VAULT.kid = kid;
  VAULT.dataKey = await deriveFromMaster(base, 'calyx-data-v1', 'AES-GCM');
  VAULT.hmacKey = await deriveFromMaster(base, 'calyx-hmac-v1', 'HMAC');
  VAULT.exportKey = await deriveFromMaster(base, 'calyx-export-v1', 'AES-GCM');
  VAULT.unlocked = true;
}
function lockVault() {
  VAULT.unlocked = false; VAULT.kid = null; VAULT.dataKey = null; VAULT.hmacKey = null; VAULT.exportKey = null;
}

/* ---- Keyring: wraps the master secret (MS) under one or more unlock slots ---- */
async function loadKeyring() { return db.vault.get('keyring'); }
async function saveKeyring(kr) { return db.vault.put({ key: 'keyring', ...kr }); }
function hasPasswordSlot(kr) { return kr.slots.some(s => s.type === 'password'); }

async function buildSecretSlot(type, secret, msBytes) {
  const salt = randomBytes(16);
  const kek = await deriveKekFromSecret(secret, salt, PBKDF2_ITERATIONS);
  const { iv, ct } = await aesEncrypt(kek, msBytes, MS_AAD);
  return { type, kdf: { alg: KDF_ALG, iter: PBKDF2_ITERATIONS, salt: b64(salt) }, iv, wrapped: ct };
}
async function buildDeviceSlot(msBytes) {
  const deviceKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const { iv, ct } = await aesEncrypt(deviceKey, msBytes, MS_AAD);
  return { type: 'device', iv, wrapped: ct, deviceKey };
}
// Pure: tries every password/recovery slot against a candidate secret, returns raw MS bytes or null.
async function tryUnwrapMasterSecret(slots, secret) {
  for (const slot of slots.filter(s => s.type === 'password' || s.type === 'recovery')) {
    try {
      const salt = new Uint8Array(unb64(slot.kdf.salt));
      const kek = await deriveKekFromSecret(secret, salt, slot.kdf.iter);
      const ptBuf = await aesDecrypt(kek, slot.iv, slot.wrapped, MS_AAD);
      return new Uint8Array(ptBuf);
    } catch { /* wrong secret for this slot; try next */ }
  }
  return null;
}
async function deriveExportKeyFromMs(msBytes) {
  const base = await importMasterSecret(msBytes);
  return deriveFromMaster(base, 'calyx-export-v1', 'AES-GCM');
}

async function createKeyringNoPassword() {
  const msBytes = randomBytes(32);
  const kid = crypto.randomUUID();
  const deviceSlot = await buildDeviceSlot(msBytes);
  await saveKeyring({ kid, slots: [deviceSlot] });
  await deriveVaultKeys(msBytes, kid);
}
async function unlockWithDeviceSlot(kr) {
  const slot = kr.slots.find(s => s.type === 'device');
  if (!slot) throw new Error('No device key available');
  const ptBuf = await aesDecrypt(slot.deviceKey, slot.iv, slot.wrapped, MS_AAD);
  await deriveVaultKeys(new Uint8Array(ptBuf), kr.kid);
}
async function unlockWithSecret(kr, secret) {
  const msBytes = await tryUnwrapMasterSecret(kr.slots, secret);
  if (!msBytes) return false;
  await deriveVaultKeys(msBytes, kr.kid);
  return true;
}

// Extracts current MS bytes from the active unlocked session by re-reading
// the keyring's device slot (no-password) or re-deriving is not possible from
// VAULT alone (data key only) — callers in password/recovery flows always have
// the plaintext secret on hand (current password or recovery key) and use
// tryUnwrapMasterSecret directly; this helper is for the no-password -> password
// transition where only the device slot can reveal MS.
async function extractMsViaDeviceSlot(kr) {
  const slot = kr.slots.find(s => s.type === 'device');
  if (!slot) throw new Error('No device key available');
  const ptBuf = await aesDecrypt(slot.deviceKey, slot.iv, slot.wrapped, MS_AAD);
  return new Uint8Array(ptBuf);
}

const MIN_PASSWORD_LENGTH = 10;
function validatePasswordLength(pw) {
  if (!pw || pw.length < MIN_PASSWORD_LENGTH) throw new Error(`Password must be at least ${MIN_PASSWORD_LENGTH} characters`);
}

// No-password -> password mode. Creates password + recovery slots, drops the
// device slot. Data is never re-encrypted (only MS wrapping changes).
// Returns the recovery key (shown once).
async function setPassword(password) {
  validatePasswordLength(password);
  const kr = await loadKeyring();
  const msBytes = hasPasswordSlot(kr) ? null : await extractMsViaDeviceSlot(kr);
  if (!msBytes) throw new Error('Password already set; use changePassword');
  const recoveryKey = generateRecoveryKey();
  const passwordSlot = await buildSecretSlot('password', password, msBytes);
  const recoverySlot = await buildSecretSlot('recovery', recoveryKey, msBytes);
  await saveKeyring({ kid: kr.kid, slots: [passwordSlot, recoverySlot] });
  return recoveryKey;
}

// Requires the current password or recovery key. Rewraps MS under a new password slot.
async function changePassword(currentSecret, newPassword) {
  validatePasswordLength(newPassword);
  const kr = await loadKeyring();
  const msBytes = await tryUnwrapMasterSecret(kr.slots, currentSecret);
  if (!msBytes) throw new Error('Current password or recovery key is incorrect');
  const recoverySlot = kr.slots.find(s => s.type === 'recovery');
  const passwordSlot = await buildSecretSlot('password', newPassword, msBytes);
  await saveKeyring({ kid: kr.kid, slots: [passwordSlot, recoverySlot] });
}

// Requires the current password. Drops password+recovery slots, recreates a device slot.
async function removePassword(currentSecret) {
  const kr = await loadKeyring();
  const msBytes = await tryUnwrapMasterSecret(kr.slots, currentSecret);
  if (!msBytes) throw new Error('Password is incorrect');
  const deviceSlot = await buildDeviceSlot(msBytes);
  await saveKeyring({ kid: kr.kid, slots: [deviceSlot] });
}

// Requires the current password or recovery key. Returns the new recovery key (shown once).
async function regenerateRecoveryKey(currentSecret) {
  const kr = await loadKeyring();
  const msBytes = await tryUnwrapMasterSecret(kr.slots, currentSecret);
  if (!msBytes) throw new Error('Current password or recovery key is incorrect');
  const passwordSlot = kr.slots.find(s => s.type === 'password');
  const recoveryKey = generateRecoveryKey();
  const recoverySlot = await buildSecretSlot('recovery', recoveryKey, msBytes);
  await saveKeyring({ kid: kr.kid, slots: [passwordSlot, recoverySlot] });
  return recoveryKey;
}

async function detectVaultState() {
  const kr = await loadKeyring();
  if (!kr) {
    for (const name of ['chats', 'messages', 'profiles', 'memories', 'files', 'segments', 'digests']) {
      if (await db.table(name).count() > 0) return 'migrate';
    }
    return 'first-run';
  }
  return kr.slots.some(s => s.type === 'device') ? 'auto-unlock' : 'locked';
}

/* ---- Record envelope: plaintext index fields + one AES-GCM blob for the rest ---- */
const PLAIN_FIELDS = {
  chats: ['id', 'createdAt', 'updatedAt', 'isPinned', 'profileId'],
  messages: ['id', 'chatId', 'createdAt', 'updatedAt'],
  files: ['id', 'chatId', 'hash', 'createdAt', 'updatedAt'],
  profiles: ['id', 'createdAt', 'updatedAt'],
  memories: ['id', 'chatId', 'createdAt', 'updatedAt', 'category', 'pinned'],
  segments: ['id', 'chatId', 'toAt', 'createdAt', 'updatedAt'],
  digests: ['id', 'chatId', 'updatedAt'],
  images: ['id', 'chatId', 'messageId', 'createdAt', 'updatedAt'],
  settings: ['key', 'updatedAt']
};
const SETTINGS_PLAINTEXT_KEYS = new Set(['theme']);

function primaryKeyName(table) { return db.table(table).schema.primKey.name; }

// Encrypts every field not listed in PLAIN_FIELDS into one `enc` envelope.
// Future tables default to fully encrypted except `id`/`updatedAt`.
async function seal(table, record) {
  if (table === 'settings' && SETTINGS_PLAINTEXT_KEYS.has(record.key)) return { ...record };
  if (!VAULT.unlocked) throw new Error('Vault is locked');
  const plainFields = PLAIN_FIELDS[table] || ['id', 'updatedAt'];
  const pk = primaryKeyName(table);
  const out = {}, toEncrypt = {};
  for (const [k, v] of Object.entries(record)) {
    if (plainFields.includes(k)) out[k] = v; else toEncrypt[k] = v;
  }
  if (!Object.keys(toEncrypt).length) return out;
  const aad = new TextEncoder().encode(`${table}|${record[pk]}`);
  const pt = new TextEncoder().encode(JSON.stringify(toEncrypt));
  const { iv, ct } = await aesEncrypt(VAULT.dataKey, pt, aad);
  out.enc = { v: 1, kid: VAULT.kid, iv, ct };
  return out;
}

async function open(table, stored) {
  if (!stored || !stored.enc) return stored;
  if (!VAULT.unlocked) throw new Error('Vault is locked');
  const pk = primaryKeyName(table);
  const aad = new TextEncoder().encode(`${table}|${stored[pk]}`);
  const ptBuf = await aesDecrypt(VAULT.dataKey, stored.enc.iv, stored.enc.ct, aad);
  const decrypted = JSON.parse(new TextDecoder().decode(ptBuf));
  const { enc, ...plain } = stored;
  return { ...plain, ...decrypted };
}

/* ---- Data-access layer: every read/write of chat content goes through here ---- */
async function dbGet(table, key) { return open(table, await db.table(table).get(key)); }
async function dbBulkGet(table, keys) {
  const rows = await db.table(table).bulkGet(keys);
  return Promise.all(rows.map(r => open(table, r)));
}
async function dbWhereEquals(table, index, value, sortField) {
  const coll = db.table(table).where(index).equals(value);
  const rows = sortField ? await coll.sortBy(sortField) : await coll.toArray();
  return Promise.all(rows.map(r => open(table, r)));
}
async function dbWhereAnyOf(table, index, values) {
  const rows = values.length ? await db.table(table).where(index).anyOf(values).toArray() : [];
  return Promise.all(rows.map(r => open(table, r)));
}
async function dbToArray(table) {
  const rows = await db.table(table).toArray();
  return Promise.all(rows.map(r => open(table, r)));
}
async function dbAdd(table, record) { return db.table(table).add(await seal(table, record)); }
async function dbBulkAdd(table, records) { return db.table(table).bulkAdd(await Promise.all(records.map(r => seal(table, r)))); }
async function dbPut(table, record) { return db.table(table).put(await seal(table, record)); }
async function dbBulkPut(table, records) { return db.table(table).bulkPut(await Promise.all(records.map(r => seal(table, r)))); }
// For modify() calls that only ever touch declared plaintext fields (no decryption needed).
async function dbUpdatePlainWhere(table, index, value, changes) {
  const plainFields = PLAIN_FIELDS[table] || ['id', 'updatedAt'];
  for (const k of Object.keys(changes)) {
    if (!plainFields.includes(k)) throw new Error(`dbUpdatePlainWhere: "${k}" is not a plaintext field on "${table}"`);
  }
  return db.table(table).where(index).equals(value).modify(changes);
}

/* ---- One-time migration: seals every pre-encryption plaintext record ---- */
// Idempotent/resumable: safe to call again after a prior partial failure —
// it never creates a new keyring itself (that would orphan records already
// sealed under the previous master secret). Callers must ensure the vault is
// already unlocked (fresh migration: caller calls createKeyringNoPassword()
// first; resume on an existing keyring: caller unlocks via device/password
// first) before invoking this.
async function sealRemainingPlaintextRecords(onProgress) {
  const tableNames = db.tables.map(t => t.name).filter(n => n !== 'vault');
  for (const name of tableNames) {
    const table = db.table(name);
    let offset = 0;
    const pageSize = 500;
    while (true) {
      const page = await table.offset(offset).limit(pageSize).toArray();
      if (!page.length) break;
      const todo = page.filter(r => !r.enc && !(name === 'settings' && SETTINGS_PLAINTEXT_KEYS.has(r.key)));
      if (todo.length) {
        const sealed = await Promise.all(todo.map(async r => {
          if (name === 'files') r = { ...r, hash: await hmacHex(VAULT.hmacKey, r.text) };
          return seal(name, r);
        }));
        await table.bulkPut(sealed);
      }
      offset += page.length;
      if (onProgress) onProgress(name, offset);
      if (page.length < pageSize) break;
    }
  }
  for (const name of tableNames) {
    const unsealed = await db.table(name).filter(r => !r.enc && !(name === 'settings' && SETTINGS_PLAINTEXT_KEYS.has(r.key))).count();
    if (unsealed > 0) throw new Error(`Migration incomplete for table "${name}" (${unsealed} unsealed records)`);
  }
}

// Fresh migration (no keyring yet): create the no-password keyring, then seal.
async function migratePlaintextDatabase(onProgress) {
  await createKeyringNoPassword();
  await sealRemainingPlaintextRecords(onProgress);
}

// Cheap safety-net check used on every boot (after unlock) to catch a
// migration interrupted by a prior crash — e.g. mid-way through sealing when
// the keyring already exists, so detectVaultState() alone can't tell.
async function hasUnsealedRecords() {
  const tableNames = db.tables.map(t => t.name).filter(n => n !== 'vault');
  for (const name of tableNames) {
    const count = await db.table(name).filter(r => !r.enc && !(name === 'settings' && SETTINGS_PLAINTEXT_KEYS.has(r.key))).count();
    if (count > 0) return true;
  }
  return false;
}

const DB_SCHEMA_VERSION = 4;
const IMPORT_BATCH_SIZE = 500;

/* ---------------------------------------------------------------------- */
/* Backup Export / Import                                                  */
/* Encrypted ".calyx" container (current) + legacy plaintext ".ndjson.gz"  */
/* (v4, read-only) import path. See plans/encryption.md §8-9.              */
/* ---------------------------------------------------------------------- */
const EXPORT_PAGE_SIZE = 500;
const CALYX_ENC_MAGIC = 'CALYXENC';
const EXPORT_CHUNK_SIZE = 65536;

function assertStreamingCompressionSupported() {
  if (typeof CompressionStream === 'undefined' || typeof DecompressionStream === 'undefined') {
    throw new Error('This browser lacks compression stream support; use a recent Chrome, Edge, or Firefox.');
  }
}

function u32be(n) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n); return b; }
function u64beCounter(n) { const b = new Uint8Array(8); const dv = new DataView(b.buffer); dv.setUint32(0, Math.floor(n / 4294967296)); dv.setUint32(4, n >>> 0); return b; }
function concatBytes(...arrs) {
  const total = arrs.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let o = 0;
  for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}

// Reads every table generically (future tables round-trip automatically),
// decrypting each record first, and yields NDJSON lines: header, N records, footer.
async function* generateBackupLines() {
  const tableNames = db.tables.map(t => t.name).filter(n => n !== 'vault');
  const counts = {};
  yield JSON.stringify({ type: 'header', format: BACKUP_FORMAT, version: BACKUP_VERSION, dbSchema: DB_SCHEMA_VERSION, exportedAt: new Date().toISOString() }) + '\n';
  for (const name of tableNames) {
    const table = db.table(name);
    counts[name] = 0;
    let offset = 0;
    while (true) {
      const page = await table.offset(offset).limit(EXPORT_PAGE_SIZE).toArray();
      if (!page.length) break;
      for (const stored of page) {
        if (name === 'settings' && isSecretKey(stored.key)) continue;
        const record = await open(name, stored);
        yield JSON.stringify({ type: 'record', table: name, data: sanitizeRecord(name, record) }) + '\n';
        counts[name]++;
      }
      offset += page.length;
      if (page.length < EXPORT_PAGE_SIZE) break;
    }
  }
  yield JSON.stringify({ type: 'footer', counts }) + '\n';
}

function backupLineStream() {
  const gen = generateBackupLines();
  return new ReadableStream({
    async pull(controller) {
      const { value, done } = await gen.next();
      if (done) { controller.close(); return; }
      controller.enqueue(value);
    }
  });
}

// Wraps a fresh random file key (FK) so the backup can be opened later:
// always by the current vault's export key (fast path — same instance, or a
// future sync peer sharing the keyring), plus either the password+recovery
// keyring slots (password mode — any holder of the password or recovery key
// can import) or a one-time export password (no-password mode, prompted at
// export time). Device slots are never exported (device-bound, non-portable).
async function buildFileKeyWraps(fileKeyBytes, exportPassword) {
  const kr = await loadKeyring();
  const wraps = {};
  { const { iv, ct } = await aesEncrypt(VAULT.exportKey, fileKeyBytes, MS_AAD); wraps.kid = { kid: VAULT.kid, iv, wrapped: ct }; }
  if (hasPasswordSlot(kr)) {
    wraps.keyring = { kid: kr.kid, slots: kr.slots.filter(s => s.type !== 'device').map(({ type, kdf, iv, wrapped }) => ({ type, kdf, iv, wrapped })) };
  } else {
    if (!exportPassword) throw new Error('Export password is required when no account password is set');
    validatePasswordLength(exportPassword);
    const salt = randomBytes(16);
    const kek = await deriveKekFromSecret(exportPassword, salt, PBKDF2_ITERATIONS);
    const { iv, ct } = await aesEncrypt(kek, fileKeyBytes, MS_AAD);
    wraps.exportPassword = { kdf: { alg: KDF_ALG, iter: PBKDF2_ITERATIONS, salt: b64(salt) }, iv, wrapped: ct };
  }
  return wraps;
}

// Buffers plaintext bytes into fixed-size chunks and AES-GCM encrypts each,
// prefixed with its ciphertext length. AAD binds header hash + chunk index +
// a final-chunk flag, so truncation, reordering, and header tampering all
// fail authentication on decrypt.
function makeEncryptChunkStream(fileKey, headerHashBytes, ivPrefix) {
  let buffer = new Uint8Array(0);
  let index = 0;
  async function encryptChunk(bytes, isFinal) {
    const iv = concatBytes(ivPrefix, u64beCounter(index));
    const aad = concatBytes(headerHashBytes, u32be(index), new Uint8Array([isFinal ? 1 : 0]));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, fileKey, bytes));
    index++;
    return concatBytes(u32be(ct.length), ct);
  }
  return new TransformStream({
    async transform(chunk, controller) {
      buffer = concatBytes(buffer, chunk);
      while (buffer.length >= EXPORT_CHUNK_SIZE) {
        controller.enqueue(await encryptChunk(buffer.slice(0, EXPORT_CHUNK_SIZE), false));
        buffer = buffer.slice(EXPORT_CHUNK_SIZE);
      }
    },
    async flush(controller) {
      controller.enqueue(await encryptChunk(buffer, true));
    }
  });
}

function prependStream(prefixBytes, sourceStream) {
  const reader = sourceStream.getReader();
  let prefixSent = false;
  return new ReadableStream({
    async pull(controller) {
      if (!prefixSent) { controller.enqueue(prefixBytes); prefixSent = true; return; }
      const { value, done } = await reader.read();
      if (done) { controller.close(); return; }
      controller.enqueue(value);
    }
  });
}

// promptExportPassword: async () => string|null (null = user cancelled). Only
// invoked in no-password mode, where no keyring secret exists to embed.
async function exportData(promptExportPassword) {
  try {
    if (!VAULT.unlocked) throw new Error('Unlock Calyx before exporting');
    assertStreamingCompressionSupported();

    const kr = await loadKeyring();
    let exportPassword = null;
    if (!hasPasswordSlot(kr)) {
      exportPassword = await promptExportPassword();
      if (exportPassword === null) return;
    }

    const fileKeyBytes = randomBytes(32);
    const fileKey = await crypto.subtle.importKey('raw', fileKeyBytes, 'AES-GCM', false, ['encrypt']);
    const fileKeyWraps = await buildFileKeyWraps(fileKeyBytes, exportPassword);
    const ivPrefix = randomBytes(4);
    const headerObj = {
      format: 'calyx-backup', version: BACKUP_VERSION, dbSchema: DB_SCHEMA_VERSION, exportedAt: new Date().toISOString(),
      enc: { alg: 'AES-GCM-256', chunk: EXPORT_CHUNK_SIZE, ivPrefix: b64(ivPrefix), fileKeyWraps }
    };
    const headerBytes = new TextEncoder().encode(JSON.stringify(headerObj));
    const headerHashBytes = new Uint8Array(await crypto.subtle.digest('SHA-256', headerBytes));
    const prefix = concatBytes(new TextEncoder().encode(CALYX_ENC_MAGIC), u32be(headerBytes.length), headerBytes);

    const cipherStream = backupLineStream()
      .pipeThrough(new TextEncoderStream())
      .pipeThrough(new CompressionStream('gzip'))
      .pipeThrough(makeEncryptChunkStream(fileKey, headerHashBytes, ivPrefix));
    const fullStream = prependStream(prefix, cipherStream);

    const filename = `calyx-backup-${new Date().toISOString().replace(/[:.]/g, '-')}.calyx`;
    if (window.showSaveFilePicker) {
      let handle;
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'Calyx Encrypted Backup', accept: { 'application/octet-stream': ['.calyx'] } }]
        });
      } catch (err) {
        if (err.name === 'AbortError') return;
        throw err;
      }
      const writable = await handle.createWritable();
      await fullStream.pipeTo(writable);
    } else {
      const blob = await new Response(fullStream).blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }
    showToast('Data exported successfully');
  } catch (err) {
    showToast(`Export failed: ${err.message}`, 'error');
  }
}

async function sniffBackupFormat(file) {
  const head8 = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  if (new TextDecoder().decode(head8) === CALYX_ENC_MAGIC) return 'enc';
  if (head8.length >= 2 && head8[0] === 0x1f && head8[1] === 0x8b) return 'gzip';
  return null;
}

async function parseEncHeader(file) {
  const headBytes = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  if (headBytes.length < 12) throw new Error('Corrupt backup: truncated header');
  const headerLen = new DataView(headBytes.buffer).getUint32(8);
  const headerBytes = new Uint8Array(await file.slice(12, 12 + headerLen).arrayBuffer());
  if (headerBytes.length < headerLen) throw new Error('Corrupt backup: truncated header');
  let header;
  try { header = JSON.parse(new TextDecoder().decode(headerBytes)); } catch { throw new Error('Corrupt backup: invalid header'); }
  const headerHashBytes = new Uint8Array(await crypto.subtle.digest('SHA-256', headerBytes));
  return { header, headerHashBytes, bodyOffset: 12 + headerLen };
}

// Unwraps the file key via, in order: the local vault's export key (same
// kid — silent), the embedded password/recovery keyring slots (prompts for
// the source password or recovery key), or a one-time export password
// (prompts). promptSecret: async (kind) => string|null ('password-or-recovery'|'export-password').
async function unwrapFileKey(header, promptSecret) {
  const wraps = header.enc.fileKeyWraps;
  const ivPrefix = new Uint8Array(unb64(header.enc.ivPrefix));
  if (VAULT.unlocked && wraps.kid && wraps.kid.kid === VAULT.kid) {
    try {
      const ptBuf = await aesDecrypt(VAULT.exportKey, wraps.kid.iv, wraps.kid.wrapped, MS_AAD);
      return { fileKey: await crypto.subtle.importKey('raw', ptBuf, 'AES-GCM', false, ['decrypt']), ivPrefix };
    } catch { /* kid matched but key differs (shouldn't happen) — fall through */ }
  }
  if (wraps.keyring) {
    const secret = await promptSecret('password-or-recovery');
    if (secret === null) throw new Error('Import cancelled');
    const msBytes = await tryUnwrapMasterSecret(wraps.keyring.slots, secret);
    if (!msBytes) throw new Error('Incorrect password or recovery key');
    const exportKey = await deriveExportKeyFromMs(msBytes);
    const ptBuf = await aesDecrypt(exportKey, wraps.kid.iv, wraps.kid.wrapped, MS_AAD);
    return { fileKey: await crypto.subtle.importKey('raw', ptBuf, 'AES-GCM', false, ['decrypt']), ivPrefix };
  }
  if (wraps.exportPassword) {
    const secret = await promptSecret('export-password');
    if (secret === null) throw new Error('Import cancelled');
    const salt = new Uint8Array(unb64(wraps.exportPassword.kdf.salt));
    const kek = await deriveKekFromSecret(secret, salt, wraps.exportPassword.kdf.iter);
    try {
      const ptBuf = await aesDecrypt(kek, wraps.exportPassword.iv, wraps.exportPassword.wrapped, MS_AAD);
      return { fileKey: await crypto.subtle.importKey('raw', ptBuf, 'AES-GCM', false, ['decrypt']), ivPrefix };
    } catch { throw new Error('Incorrect export password'); }
  }
  throw new Error('Corrupt backup: no usable key wrap');
}

// Lookahead-buffered chunk decryptor: the final chunk's AAD flag can only be
// known once the next chunk fails to materialize, so one chunk is always held
// back by one step.
async function* decryptChunks(file, bodyOffset, fileKey, headerHashBytes, ivPrefix) {
  const reader = file.slice(bodyOffset).stream().getReader();
  let buf = new Uint8Array(0);
  let index = 0;
  async function readMore() {
    const { value, done } = await reader.read();
    if (done) return false;
    buf = concatBytes(buf, value);
    return true;
  }
  async function nextRawChunk() {
    while (buf.length < 4) { if (!(await readMore())) return null; }
    const len = new DataView(buf.buffer, buf.byteOffset, 4).getUint32(0);
    while (buf.length < 4 + len) { if (!(await readMore())) throw new Error('Corrupt backup: truncated chunk'); }
    const ct = buf.slice(4, 4 + len);
    buf = buf.slice(4 + len);
    return ct;
  }
  let cur = await nextRawChunk();
  if (cur === null) throw new Error('Corrupt backup: empty file');
  while (cur !== null) {
    const next = await nextRawChunk();
    const isFinal = next === null;
    const iv = concatBytes(ivPrefix, u64beCounter(index));
    const aad = concatBytes(headerHashBytes, u32be(index), new Uint8Array([isFinal ? 1 : 0]));
    let pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: aad }, fileKey, cur); }
    catch { throw new Error('Corrupt or tampered backup file'); }
    yield new Uint8Array(pt);
    index++;
    cur = next;
  }
}

function streamFromAsyncGenerator(gen) {
  return new ReadableStream({
    async pull(controller) {
      const { value, done } = await gen.next();
      if (done) { controller.close(); return; }
      controller.enqueue(value);
    }
  });
}

// Decompresses + line-splits a gzip byte stream without loading the whole thing into memory.
async function* readNdjsonLinesFromStream(gzipByteStream) {
  const reader = gzipByteStream.pipeThrough(new DecompressionStream('gzip')).pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx);
        buf = buf.slice(idx + 1);
        if (line.trim()) yield line;
      }
    }
    if (buf.trim()) yield buf;
  } finally {
    reader.releaseLock();
  }
}

// Pass 1: validates the entire file (header, record shapes, footer counts)
// without writing anything. Throws on the first problem found. `makeLines` is
// a factory so the file can be re-read (and re-decrypted) for Pass 2 without
// re-prompting for a secret (the unwrapped file key is captured by closure).
async function validateBackupFile(makeLines) {
  const tableNames = new Set(db.tables.map(t => t.name).filter(n => n !== 'vault'));
  let sawHeader = false, sawFooter = false;
  const counts = {};
  for await (const line of makeLines()) {
    let obj;
    try { obj = JSON.parse(line); } catch { throw new Error('Corrupt backup: invalid JSON line'); }
    if (obj.type === 'header') {
      if (sawHeader) throw new Error('Corrupt backup: duplicate header');
      if (obj.format !== BACKUP_FORMAT) throw new Error('Not a Calyx backup file');
      if (typeof obj.dbSchema === 'number' && obj.dbSchema > DB_SCHEMA_VERSION) {
        throw new Error('Backup was created by a newer version of Calyx; update Calyx first');
      }
      sawHeader = true;
    } else if (obj.type === 'record') {
      if (!sawHeader) throw new Error('Corrupt backup: record before header');
      if (sawFooter) throw new Error('Corrupt backup: record after footer');
      if (typeof obj.table !== 'string' || !obj.data || typeof obj.data !== 'object') {
        throw new Error('Corrupt backup: malformed record');
      }
      if (!tableNames.has(obj.table)) continue;
      counts[obj.table] = (counts[obj.table] || 0) + 1;
    } else if (obj.type === 'footer') {
      if (!sawHeader) throw new Error('Corrupt backup: footer before header');
      sawFooter = true;
      for (const [table, expected] of Object.entries(obj.counts || {})) {
        if (tableNames.has(table) && (counts[table] || 0) !== expected) {
          throw new Error(`Corrupt backup: truncated "${table}" data (expected ${expected}, found ${counts[table] || 0})`);
        }
      }
    } else {
      throw new Error('Corrupt backup: unknown entry type');
    }
  }
  if (!sawHeader || !sawFooter) throw new Error('Corrupt backup: missing header or footer');
}

// Pass 2: re-reads the already-validated file and writes it in batches.
// Records arrive decrypted (plaintext) from either format; each is sealed
// with the LOCAL vault's keys before being written (backup files are never
// tied to the importing instance's encryption).
async function writeBackupFile(makeLines, mode) {
  const tableNames = db.tables.map(t => t.name).filter(n => n !== 'vault');

  if (mode === 'replace') {
    await db.transaction('rw', db.tables.filter(t => t.name !== 'vault'), async () => {
      for (const name of tableNames) {
        if (name === 'settings') {
          const secretRows = (await db.settings.toArray()).filter(r => isSecretKey(r.key));
          await db.settings.clear();
          if (secretRows.length) await db.settings.bulkPut(secretRows);
        } else {
          await db.table(name).clear();
        }
      }
    });
  }

  const batches = Object.fromEntries(tableNames.map(n => [n, []]));
  async function flush(name, force) {
    const batch = batches[name];
    if (!batch.length || (!force && batch.length < IMPORT_BATCH_SIZE)) return;
    const toWrite = batch.splice(0, batch.length);
    if (name === 'settings') {
      if (mode === 'replace') await db.table(name).bulkPut(await Promise.all(toWrite.map(r => seal('settings', r))));
      return; // merge keeps local settings
    }
    const sealedWrite = await Promise.all(toWrite.map(r => seal(name, r)));
    if (mode === 'replace') {
      await db.table(name).bulkPut(sealedWrite);
    } else {
      const existing = await db.table(name).bulkGet(toWrite.map(r => r.id));
      // updatedAt is always a plaintext index field — comparable without decrypting.
      const winners = sealedWrite.filter((r, i) => !existing[i] || (toWrite[i].updatedAt ?? 0) > (existing[i].updatedAt ?? 0));
      if (winners.length) await db.table(name).bulkPut(winners);
    }
  }

  for await (const line of makeLines()) {
    const obj = JSON.parse(line);
    if (obj.type !== 'record' || !tableNames.includes(obj.table)) continue;
    if (obj.table === 'settings' && isSecretKey(obj.data.key)) continue;
    const data = sanitizeRecord(obj.table, obj.data);
    if (obj.table === 'files' && data.text != null) data.hash = await hmacHex(VAULT.hmacKey, data.text);
    batches[obj.table].push(data);
    await flush(obj.table, false);
  }
  for (const name of tableNames) await flush(name, true);
}

// promptSecret: async (kind) => string|null — used only for the encrypted
// (.calyx) format when the file wasn't produced by this exact vault.
async function performImport(file, mode, promptSecret) {
  try {
    if (!VAULT.unlocked) throw new Error('Unlock Calyx before importing');
    const format = await sniffBackupFormat(file);
    if (!format) throw new Error('Not a Calyx backup file');
    assertStreamingCompressionSupported();

    let makeLines;
    if (format === 'gzip') {
      makeLines = () => readNdjsonLinesFromStream(file.stream());
    } else {
      const { header, headerHashBytes, bodyOffset } = await parseEncHeader(file);
      if (header.format !== 'calyx-backup') throw new Error('Not a Calyx backup file');
      if (typeof header.dbSchema === 'number' && header.dbSchema > DB_SCHEMA_VERSION) {
        throw new Error('Backup was created by a newer version of Calyx; update Calyx first');
      }
      const { fileKey, ivPrefix } = await unwrapFileKey(header, promptSecret);
      makeLines = () => readNdjsonLinesFromStream(streamFromAsyncGenerator(decryptChunks(file, bodyOffset, fileKey, headerHashBytes, ivPrefix)));
    }

    await validateBackupFile(makeLines);
    await writeBackupFile(makeLines, mode);
    showToast('Data imported successfully');
    return true;
  } catch (err) {
    showToast(`Import failed: ${err.message}`, 'error');
    return false;
  }
}

const IconComponent = {

      this.$refs.el.replaceChildren(svg);
    }
  }
};

  props: { chat: { type: Object, required: true }, active: { type: Boolean, default: false } },

  template: document.getElementById('chat-list-item-template').innerHTML,
  setup(props, { emit }) {
    const editing = ref(false);
    const draft = ref(props.chat.title);
    const input = ref(null);

    async function startEdit() {
      draft.value = props.chat.title;
      editing.value = true;
      await nextTick();
      input.value?.focus();
      input.value?.select();
    }

    function commit() {
      if (!editing.value) return;
      editing.value = false;
      const title = draft.value || 'Untitled Chat';
      if (title !== props.chat.title) emit('rename', props.chat, title);
    }

    return { editing, draft, input, startEdit, commit };
  }
};

/* ---------------------------------------------------------------------- */
/* Message bubble component                                               */
/* ---------------------------------------------------------------------- */
const MessageBubble = {
  props: { msg: { type: Object, required: true }, memories: { type: Array, default: () => [] }, chatIds: { type: Array, default: () => [] } },
  emits: ['delete-memory', 'create-session', 'dismiss-session', 'open-chat'],
  template: document.getElementById('message-bubble-template').innerHTML,
  setup(props) {
    const rendered = computed(() => {
      if (props.msg.role !== 'assistant') return '';
      return renderMarkdown(props.msg.content);
    });
    const msgMemories = computed(() => {
      const ids = props.msg.memoryIds || [];
      if (!ids.length) return [];
      return props.memories.filter(m => ids.includes(m.id));
    });
    const titleDraft = ref(props.msg.sessionProposal?.title || '');
    const sessionStillExists = computed(() => {
      const chatId = props.msg.sessionProposal?.chatId;
      return !chatId || props.chatIds.includes(chatId);
    });
    const imageUrls = ref({});
    const imageIds = (props.msg.attachments || []).filter(a => a.type === 'image').map(a => a.imageId).filter(Boolean);
    if (imageIds.length) {
      dbBulkGet('images', imageIds).then(rows => {
        const urls = {};
        rows.forEach(img => { if (img) urls[img.id] = `data:${img.mimeType};base64,${img.data}`; });
        imageUrls.value = urls;
      });
    }
    return { rendered, msgMemories, titleDraft, sessionStillExists, imageUrls };
  },
  mounted() { this.highlightCode(); },
  updated() { this.highlightCode(); },
  methods: {
    highlightCode() {
      this.$el.querySelectorAll('pre code').forEach(block => {
        if (!block.dataset.highlighted) hljs.highlightElement(block);
      });
      // Inject copy buttons
      this.$el.querySelectorAll('pre').forEach(pre => {
        if (pre.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-btn absolute top-2 right-2 text-xs px-2 py-0.5 rounded bg-slate-600 hover:bg-slate-500 text-slate-200 opacity-0 group-hover:opacity-100 pointer-coarse:opacity-100 transition-opacity';
        btn.textContent = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.querySelector('code')?.innerText || '');
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 1500);
        };
        pre.style.position = 'relative';
        pre.classList.add('group');
        pre.appendChild(btn);
      });
    }
  }
};

/* ---------------------------------------------------------------------- */
/* Toasts (module-scoped: shared by the Vue app and the standalone         */
/* export/import/vault functions above, which run outside setup())         */

const toasts = ref([]);
function showToast(message, type = 'info') {
  const id = Date.now() + Math.random();
  toasts.value.push({ id, message, type });
  setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id); }, 3500);
}

    /* ---- Session branching (model-proposed new session) ---- */
    function updateMessageProposal(msgId, patch) {
      const idx = messages.value.findIndex(m => m.id === msgId);
      if (idx !== -1) messages.value[idx] = { ...messages.value[idx], sessionProposal: { ...messages.value[idx].sessionProposal, ...patch } };
    }

    async function createBranchSession(msg, title) {
      if (!msg.sessionProposal || msg.sessionProposal.status !== 'pending') return;
      const proposal = msg.sessionProposal;
      const finalTitle = (title || proposal.title || '').trim().slice(0, 80) || 'New Session';
      const now = Date.now();
      const newChatId = crypto.randomUUID();
      try {
        const originChat = await dbGet('chats', msg.chatId);
        if (!originChat || !originChat.profileId) throw new Error('Origin chat is no longer in a profile');
        const fullMsg = await dbGet('messages', msg.id);
        const newChatRecord = await seal('chats', { id: newChatId, title: finalTitle, createdAt: now, updatedAt: now, isPinned: false, profileId: originChat.profileId });
        const decisionMemory = await seal('memories', {
          id: crypto.randomUUID(), chatId: originChat.id, category: 'decision',
          content: `Decided on ${fmtUTC(now)} to explore "${finalTitle}" in a separate session: ${proposal.purpose}`,
          when: null, source: 'user', pinned: false, sourceMessageId: msg.id, createdAt: now, updatedAt: now
        });
        const goalMemory = await seal('memories', {
          id: crypto.randomUUID(), chatId: newChatId, category: 'goal',
          content: `Session opened from session "${originChat.title}" on ${fmtUTC(now)} to explore: ${proposal.purpose}`,
          when: null, source: 'user', pinned: false, sourceMessageId: null, createdAt: now, updatedAt: now
        });
        const updatedMsg = await seal('messages', { ...fullMsg, sessionProposal: { ...proposal, title: finalTitle, status: 'created', chatId: newChatId } });
        await db.transaction('rw', db.chats, db.memories, db.messages, async () => {
          await db.chats.add(newChatRecord);
          await db.memories.add(decisionMemory);
          await db.memories.add(goalMemory);
          await db.messages.put(updatedMsg);
        });
        updateMessageProposal(msg.id, { title: finalTitle, status: 'created', chatId: newChatId });
        await refreshChats();
        if (currentChatId.value === msg.chatId) await refreshChatMemories();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function dismissSessionProposal(msg) {

      const fullMsg = await dbGet('messages', msg.id);

      updateMessageProposal(msg.id, { status: 'dismissed' });

    /* ---- Digests ---- */
    async function generateDigestForChat(chatId) {
      const chatMsgs = await dbWhereEquals('messages', 'chatId', chatId, 'createdAt');
      if (!chatMsgs.length) return;
      const existingDigest = await dbGet('digests', chatId);
      const since = existingDigest ? existingDigest.coversUntilAt : 0;
      const allSegs = await dbWhereEquals('segments', 'chatId', chatId, 'toAt');
      const newSegs = allSegs.filter(s => s.toAt > since);
      const lastSegToAt = allSegs.length ? allSegs[allSegs.length - 1].toAt : 0;
      const rawAfterSegs = chatMsgs.filter(m => m.createdAt > Math.max(since, lastSegToAt));
      const parts = [...newSegs.map(s => s.content), ...rawAfterSegs.map(m => `${m.role}: ${m.content}`)];
      const newContent = parts.join('\n\n');
      if (!newContent.trim()) return;
      const result = await callUtilityModel(digestPrompt(existingDigest?.content, newContent), settings);
      const now = Date.now();
      await dbPut('digests', { id: chatId, chatId, content: result, coversUntilAt: chatMsgs[chatMsgs.length - 1].createdAt, createdAt: existingDigest?.createdAt || now, updatedAt: now });
    }

    async function ensureDigestFresh(chatId) {
      const chatMsgs = await dbWhereEquals('messages', 'chatId', chatId, 'createdAt');
      if (!chatMsgs.length) return;
      const lastAt = chatMsgs[chatMsgs.length - 1].createdAt;
      const digest = await dbGet('digests', chatId);
      if (digest && digest.coversUntilAt >= lastAt) return;
      await generateDigestForChat(chatId);
    }

    async function refreshProfileDigests(profile) {
      const profileChats = chats.value.filter(c => c.profileId === profile.id);
      for (const c of profileChats) {
        try { await ensureDigestFresh(c.id); } catch (err) { console.error('[Calyx] digest refresh failed', c.id, err); }
      }
      showToast('Digests refreshed');
    }

    /* ---- Compaction (segmented rolling summary) ---- */
    function rawMessagesBeyondSegments(segs, allMessages) {
      const lastSeg = segs[segs.length - 1];
      const startIdx = lastSeg ? allMessages.findIndex(m => m.id === lastSeg.toMessageId) + 1 : 0;
      return allMessages.slice(Math.max(startIdx, 0));
    }

    async function runCompaction(force = false) {
      const rawMessages = rawMessagesBeyondSegments(currentSegments.value, messages.value);
      const excess = rawMessages.length - settings.minRawTurns;
      if (excess <= 0) { if (force) showToast('Not enough turns to compact yet', 'error'); return; }
      const toSummarize = rawMessages.slice(0, excess);
      const transcript = toSummarize.map(m => `${m.role}: ${m.content}${imagePlaceholder(m)}`).join('\n\n');
      const summary = await callUtilityModel(segmentSummaryPrompt(transcript), settings);
      const now = Date.now();
      await dbAdd('segments', {
        id: crypto.randomUUID(), chatId: currentChatId.value, content: summary,
        fromMessageId: toSummarize[0].id, toMessageId: toSummarize[toSummarize.length - 1].id,
        fromAt: toSummarize[0].createdAt, toAt: toSummarize[toSummarize.length - 1].createdAt,
        tokens: estimateTokens(summary), createdAt: now, updatedAt: now
      });
      await refreshSegments();

      const segBudget = settings.contextBudget * SEGMENT_BUDGET_PCT / 100;
      while (currentSegments.value.reduce((s, x) => s + x.tokens, 0) > segBudget && currentSegments.value.length > 1) {
        const [a, b] = currentSegments.value;
        const merged = await callUtilityModel(segmentMergePrompt(a.content, b.content), settings);
        const mnow = Date.now();
        const mergedRecord = await seal('segments', {
          id: crypto.randomUUID(), chatId: currentChatId.value, content: merged,
          fromMessageId: a.fromMessageId, toMessageId: b.toMessageId,
          fromAt: a.fromAt, toAt: b.toAt, tokens: estimateTokens(merged), createdAt: a.createdAt, updatedAt: mnow
        });
        await db.transaction('rw', db.segments, async () => {
          await db.segments.delete(a.id);
          await db.segments.delete(b.id);
          await db.segments.add(mergedRecord);
        });
        await refreshSegments();
      }
    }

    async function compactNow() {
      if (!currentChat.value || compacting.value) return;
      compacting.value = true;
      try {
        await runCompaction(true);
        showToast('Chat compacted');
      } catch (err) {
        showToast(`Compaction failed: ${err.message}`, 'error');
      } finally {
        compacting.value = false;
      }
    }

    /* ---- Context assembly ---- */
    async function buildContextForChat(chat, allMessages, queryText) {
      const profile = chat.profileId ? profiles.value.find(p => p.id === chat.profileId) : null;
      const docsBlock = buildDocsBlock(chatFiles.value);

      let otherDigestsBlock = '', profileMemoriesBlock = '', recalledBlock = '', overCapWarned = false;

      if (profile) {
        const profileChats = chats.value.filter(c => c.profileId === profile.id);
        const sortedProfileChats = [...profileChats].sort((a, b) => a.createdAt - b.createdAt);
        const sessionOrdinal = new Map(sortedProfileChats.map((c, i) => [c.id, i + 1]));
        const otherChats = sortedProfileChats.filter(c => c.id !== chat.id);

        await Promise.all(otherChats.map(c => ensureDigestFresh(c.id).catch(() => {})));

        const otherChatIds = otherChats.map(c => c.id);
        const digestRows = await dbWhereAnyOf('digests', 'chatId', otherChatIds);
        const digestByChat = new Map(digestRows.map(d => [d.chatId, d]));
        if (digestRows.length) {
          otherDigestsBlock = `<session_digests>\n${otherChats.filter(c => digestByChat.has(c.id)).map(c => {
            const d = digestByChat.get(c.id);
            return `<session n="${sessionOrdinal.get(c.id)}" date="${fmtUTC(c.createdAt)}" title="${escapeXml(c.title)}">\n${escapeXml(d.content)}\n</session>`;
          }).join('\n')}\n</session_digests>`;
        }

        const otherMemories = await dbWhereAnyOf('memories', 'chatId', otherChatIds);
        const sel = selectMemoriesForContext({ profileMemories: otherMemories, digests: digestRows, settings, queryText });
        overCapWarned = sel.overCap;

        if (sel.included.length) {
          const bySession = new Map();
          sel.included.forEach(m => {
            if (!bySession.has(m.chatId)) bySession.set(m.chatId, []);
            bySession.get(m.chatId).push(m);
          });
          const sessionsXml = [...bySession.entries()]
            .sort((a, b) => sessionOrdinal.get(a[0]) - sessionOrdinal.get(b[0]))
            .map(([chatId, mems]) => {
              const c = otherChats.find(x => x.id === chatId);
              const lines = [...mems].sort((a, b) => a.createdAt - b.createdAt)
                .map(m => `- [${fmtUTC(m.createdAt)}] (${m.category}) ${escapeXml(m.content)}`).join('\n');
              return `<session n="${sessionOrdinal.get(chatId)}" date="${fmtUTC(c.createdAt)}" title="${escapeXml(c.title)}">\n${lines}\n</session>`;
            }).join('\n');
          profileMemoriesBlock = `<profile_memories>\n${sessionsXml}\n</profile_memories>`;
        }

        if (sel.recalled.length) {
          const lines = [...sel.recalled].sort((a, b) => a.createdAt - b.createdAt)
            .map(m => `- [${fmtUTC(m.createdAt)}] (${m.category}) ${escapeXml(m.content)}`).join('\n');
          recalledBlock = `<recalled_memories>\n${lines}\n</recalled_memories>`;
        }
      }

      const rawMessages = rawMessagesBeyondSegments(currentSegments.value, allMessages);
      let summaryBlock = '';
      if (currentSegments.value.length) {
        summaryBlock = `<conversation_summary>\n${currentSegments.value.map(s => escapeXml(s.content)).join('\n\n')}\n</conversation_summary>`;
      }

      let sessionMemoriesBlock = '';
      if (chatMemories.value.length) {
        const lines = [...chatMemories.value].sort((a, b) => a.createdAt - b.createdAt)
          .map(m => `- [${fmtUTC(m.createdAt)}] (${m.category}) ${escapeXml(m.content)}`).join('\n');
        sessionMemoriesBlock = `<session_memories>\n${lines}\n</session_memories>`;
      }

      const sessionN = profile
        ? [...chats.value].filter(c => c.profileId === profile.id).sort((a, b) => a.createdAt - b.createdAt).findIndex(c => c.id === chat.id) + 1
        : 1;
      const calyxContext = `<calyx_context>\nCurrent date/time: ${fmtUTC(Date.now())} (user local: ${localNowMeta()})\n${profile ? `Profile: ${escapeXml(profile.name)}\n` : ''}Session: #${sessionN} (${fmtUTC(chat.createdAt)})\n</calyx_context>`;

      const historyMsgs = await Promise.all(rawMessages.map(async m => {
        const imageIds = (m.attachments || []).filter(a => a.type === 'image').map(a => a.imageId).filter(Boolean);
        const images = imageIds.length
          ? (await dbBulkGet('images', imageIds)).filter(Boolean).map(img => ({ mimeType: img.mimeType, data: img.data }))
          : [];
        return {
          role: m.role,
          content: m.role === 'user' ? `[${fmtUTC(m.createdAt)}] ${m.content}` : m.content,
          ...(images.length ? { images } : {})
        };
      }));

      const branchingEnabled = !!(profile && settings.branchSessions);

      return {
        protocol: branchingEnabled ? `${PROTOCOL_BLOCK}\n${BRANCHING_BLOCK}` : PROTOCOL_BLOCK,
        mainPrompt: settings.systemPrompt || '',
        personaPrompt: profile?.systemPrompt || '',
        docsBlock, otherDigestsBlock, profileMemoriesBlock, recalledBlock,
        summaryBlock, sessionMemoriesBlock, calyxContext,
        historyMsgs, overCapWarned, branchingEnabled
      };
    }

    function buildFlatSystemText(ctx) {
      return [ctx.protocol, ctx.mainPrompt, ctx.personaPrompt, ctx.docsBlock, ctx.otherDigestsBlock,
        ctx.profileMemoriesBlock, ctx.summaryBlock, ctx.sessionMemoriesBlock, ctx.recalledBlock, ctx.calyxContext]
        .filter(Boolean).join('\n\n');
    }

    function buildAnthropicSystemBlocks(ctx) {
      const blocks = [];
      if (ctx.protocol) blocks.push({ type: 'text', text: ctx.protocol });
      if (ctx.mainPrompt) blocks.push({ type: 'text', text: ctx.mainPrompt });
      if (ctx.personaPrompt) blocks.push({ type: 'text', text: ctx.personaPrompt });
      if (ctx.docsBlock) blocks.push({ type: 'text', text: ctx.docsBlock, cache_control: { type: 'ephemeral' } });
      const block5 = [ctx.otherDigestsBlock, ctx.profileMemoriesBlock].filter(Boolean).join('\n');
      if (block5) blocks.push({ type: 'text', text: block5, cache_control: { type: 'ephemeral' } });
      if (ctx.summaryBlock) blocks.push({ type: 'text', text: ctx.summaryBlock, cache_control: { type: 'ephemeral' } });
      const volatile = [ctx.sessionMemoriesBlock, ctx.recalledBlock, ctx.calyxContext].filter(Boolean).join('\n');
      if (volatile) blocks.push({ type: 'text', text: volatile });
      return blocks;
    }

    const IMAGE_TOKEN_ESTIMATE = 1600;

    function estimateContextTokens(ctx) {
      const flat = buildFlatSystemText(ctx);
      const historyText = ctx.historyMsgs.map(m => m.content).join('\n');
      const imageCount = ctx.historyMsgs.reduce((s, m) => s + (m.images?.length || 0), 0);
      return estimateTokens(flat) + estimateTokens(historyText) + imageCount * IMAGE_TOKEN_ESTIMATE;
    }

    async function maybeAutoCompact() {
      if (!currentChat.value) return;
      try {
        const ctx = await buildContextForChat(currentChat.value, messages.value, '');
        const tokens = estimateContextTokens(ctx);
        const threshold = settings.contextBudget * settings.compactTriggerPct / 100;
        if (tokens > threshold) await runCompaction();
      } catch (err) {
        console.error('[Calyx] auto-compaction failed', err);
      }
    }

    /* ---- File handling ---- */
    function triggerFileInput() {
      fileInput.value?.click();
    }

    async function addChatFile(name, type, rawText) {
      const text = normalizeText(rawText);
      const hash = await hmacHex(VAULT.hmacKey, text);
      if (chatFiles.value.some(f => f.hash === hash)) {
        showToast(`Duplicate content skipped: ${name}`, 'error');
        return;
      }
      const tokens = estimateTokens(text);
      const now = Date.now();
      const record = { id: crypto.randomUUID(), chatId: currentChatId.value, name, type, hash, text, tokens, createdAt: now, updatedAt: now };
      await dbAdd('files', record);
      chatFiles.value.push(record);
      pendingDocIds.value.push(record.id);
      if (chatFilesTokens.value > settings.docTokenWarn) {
        showToast(`Document context is large (~${chatFilesTokens.value.toLocaleString()} tokens)`, 'error');
      }
    }

    async function handleFiles(event) {
      const files = Array.from(event.target.files);
      event.target.value = '';
      for (const file of files) {
        try {
          const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
          if (file.type.startsWith('image/')) {
            const img = await normalizeImage(file);
            attachments.value.push({ type: 'image', name: file.name, ...img });
          } else if (file.type === 'application/pdf' || ext === '.pdf') {
            const text = await extractPdfText(file, settings.pdfPageLimit, settings.pdfSizeLimitMB);
            await addChatFile(file.name, 'pdf', text);
          } else if (file.type === 'text/plain' || file.type === 'text/markdown' || ext === '.txt' || ext === '.md') {
            const text = await file.text();
            await addChatFile(file.name, 'text', text);
          } else {
            showToast(`Unsupported file type: ${file.name}`, 'error');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      }
    }

    function removeAttachment(i) {
      attachments.value.splice(i, 1);
    }

    async function removeChatFile(id) {
      await db.files.delete(id);
      chatFiles.value = chatFiles.value.filter(f => f.id !== id);
      pendingDocIds.value = pendingDocIds.value.filter(i => i !== id);
    }

    function autoResizeInput() {
      const el = inputArea.value;
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 240) + 'px';
    }

    /* ---- Sending & streaming ---- */
    async function sendMessage() {
      if (!currentChat.value || streaming.value) return;
      const text = inputText.value.trim();
      if (!text && !attachments.value.length && !pendingDocIds.value.length) return;

      const newDocNames = pendingDocIds.value
        .map(id => chatFiles.value.find(f => f.id === id)?.name)
        .filter(Boolean);
      const imageNames = attachments.value.map(a => a.name);
      const attachedNames = [...newDocNames, ...imageNames];
      const content = text || (attachedNames.length ? `Attached: ${attachedNames.join(', ')}` : '');

      const now = Date.now();
      const msgId = crypto.randomUUID();
      const pendingImages = attachments.value;

      const imageChips = await Promise.all(pendingImages.map(async a => {
        const imageId = crypto.randomUUID();
        await dbAdd('images', {
          id: imageId, chatId: currentChatId.value, messageId: msgId,
          name: a.name, mimeType: a.mimeType, data: a.data,
          width: a.width, height: a.height, createdAt: now, updatedAt: now
        });
        return { type: 'image', name: a.name, imageId };
      }));

      const userMsg = {
        id: msgId,
        chatId: currentChatId.value,
        role: 'user',
        content,
        createdAt: now,
        updatedAt: now,
        attachments: [
          ...pendingDocIds.value.map(id => {
            const f = chatFiles.value.find(x => x.id === id);
            return f ? { type: f.type, name: f.name } : null;
          }).filter(Boolean),
          ...imageChips
        ]
      };
      await dbAdd('messages', userMsg);
      messages.value.push(userMsg);

      const autoTitleSource = content;
      pendingDocIds.value = [];
      inputText.value = '';
      attachments.value = [];
      if (inputArea.value) { inputArea.value.style.height = 'auto'; }
      await nextTick(); scrollToBottom();

      // Auto-name chat after first user message
      if (messages.value.length === 1 && currentChat.value.title === 'New Chat') {
        const autoTitle = autoTitleSource.slice(0, 40) + (autoTitleSource.length > 40 ? '…' : '');
        await renameChat(currentChat.value, autoTitle);
      }

      streaming.value = true;
      streamingContent.value = '';

      const meta = { stopReason: null, complete: false };
      const TRUNCATED_REASONS = ['max_tokens', 'length', 'MAX_TOKENS'];

      try {
        const ctx = await buildContextForChat(currentChat.value, messages.value, content);
        if (ctx.overCapWarned) showToast('Profile memories exceed the context budget; consider pinning key memories', 'error');

        let gen;
        if (settings.selectedProvider === 'anthropic') {
          if (!settings.anthropicApiKey) throw new Error('Anthropic API key not set');
          gen = streamAnthropic(ctx.historyMsgs, settings, buildAnthropicSystemBlocks(ctx), meta);
        } else if (settings.selectedProvider === 'gemini') {
          if (!settings.geminiApiKey) throw new Error('Gemini API key not set');
          const sp = buildFlatSystemText(ctx);
          gen = streamGemini(ctx.historyMsgs, settings, sp ? [{ text: sp }] : null, meta);
        } else {
          if (!settings.openaiApiKey) throw new Error('OpenAI API key not set');
          const sp = buildFlatSystemText(ctx);
          const oaiMsgs = sp ? [{ role: 'system', content: sp }, ...ctx.historyMsgs] : ctx.historyMsgs;
          gen = streamOpenAI(oaiMsgs, settings, meta);
        }

        for await (const chunk of gen) {
          streamingContent.value += chunk;
          await nextTick(); scrollToBottom();
        }

        if (TRUNCATED_REASONS.includes(meta.stopReason) || !meta.complete) {
          const reason = meta.stopReason || 'stream ended early';
          streamingContent.value += `\n\n⚠️ Response truncated (${reason})`;
        }

        // Parse & persist inline <memory> tags, then a <session_proposal> tag, then persist the cleaned assistant message
        const { cleaned: afterMemory, found } = extractMemoryTags(streamingContent.value);
        const { cleaned, proposal } = extractSessionProposal(afterMemory, ctx.branchingEnabled);
        const asstNow = Date.now();
        const asstMsgId = crypto.randomUUID();
        let memoryIds = [];
        if (found.length) {
          const memRecords = found.map(f => ({
            id: crypto.randomUUID(), chatId: currentChatId.value, category: f.category, when: f.when,
            source: f.source, content: f.content, pinned: false, sourceMessageId: asstMsgId,
            createdAt: asstNow, updatedAt: asstNow
          }));
          await dbBulkAdd('memories', memRecords);
          memoryIds = memRecords.map(r => r.id);
        }

        const asstMsg = {
          id: asstMsgId,
          chatId: currentChatId.value,
          role: 'assistant',
          content: cleaned,
          createdAt: asstNow,
          updatedAt: asstNow,
          attachments: [],
          memoryIds,
          sessionProposal: proposal
        };
        await dbAdd('messages', asstMsg);
        messages.value.push(asstMsg);
        await dbUpdatePlainWhere('chats', 'id', currentChatId.value, { updatedAt: Date.now() });
        await refreshChats();
        if (memoryIds.length) await refreshChatMemories();

        await maybeAutoCompact();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        streaming.value = false;
        streamingContent.value = '';
        await nextTick(); scrollToBottom();
      }
    }

    /* ---- Import ---- */
    const showImportModal = ref(false);
    const importMode = ref('merge');
    const importFileInput = ref(null);
    const pendingImportFile = ref(null);

    function triggerImportInput() {
      if (streaming.value) return;
      importFileInput.value?.click();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      pendingImportFile.value = file;
      importMode.value = 'merge';
      showImportModal.value = true;
    }

    function cancelImport() {
      showImportModal.value = false;
      pendingImportFile.value = null;
    }

    async function confirmImport() {
      const file = pendingImportFile.value;
      const mode = importMode.value;
      showImportModal.value = false;
      pendingImportFile.value = null;
      if (!file) return;

      const ok = await performImport(file, mode, promptImportSecret);
      if (!ok) return;

      const loaded = await loadSettingsFromDb();
      Object.assign(settings, loaded);
      applyTheme();
      await refreshProfiles();
      await refreshChats();
      currentChatId.value = null;
      messages.value = [];
      chatFiles.value = [];
      pendingDocIds.value = [];
      chatMemories.value = [];
      currentSegments.value = [];
    }

    /* ---- Vault / encryption lock state machine ---- */
    const vaultState = ref('detecting');
    const migrationProgress = ref('');
    const migrationError = ref('');
    const unlockSecret = ref('');
    const unlockError = ref('');
    const showFirstRunPasswordForm = ref(false);
    const recoveryKeyDisplay = ref(null);
    const emptySecurityForm = { newPassword: '', confirmPassword: '', currentSecret: '', regenerateSecret: '', removePasswordSecret: '', error: '' };
    const securityForm = reactive({ ...emptySecurityForm });
    const hasPasswordProtection = ref(false);
    const importSecretPrompt = ref(null);
    const exportPasswordPrompt = ref(null);
    const minPasswordLength = MIN_PASSWORD_LENGTH;
    let idleTimer = null;

    function clearIdleTimer() { if (idleTimer) clearTimeout(idleTimer); idleTimer = null; }
    function resetIdleTimer() {
      clearIdleTimer();
      if (vaultState.value !== 'ready' || !hasPasswordProtection.value || !settings.autoLockMinutes) return;
      idleTimer = setTimeout(() => lockVaultNow(), settings.autoLockMinutes * 60000);
    }

    async function loadPreUnlockTheme() {
      const row = await db.settings.get('theme');
      if (row) { settings.theme = row.value; applyTheme(); }
    }

    async function afterUnlock() {
      const kr = await loadKeyring();
      hasPasswordProtection.value = hasPasswordSlot(kr);
      const loaded = await loadSettingsFromDb();
      Object.assign(settings, loaded);
      applyTheme();
      await refreshProfiles();
      await refreshChats();
      vaultState.value = 'ready';
      resetIdleTimer();
    }

    function lockVaultNow() {
      lockVault();
      chats.value = []; profiles.value = []; currentChatId.value = null; messages.value = [];
      chatMemories.value = []; currentSegments.value = []; chatFiles.value = []; pendingDocIds.value = [];
      showSettings.value = false; showMemoryPanel.value = false;
      recoveryKeyDisplay.value = null; Object.assign(securityForm, emptySecurityForm);
      clearIdleTimer();
      vaultState.value = 'locked';
    }

    // Runs after any successful unlock (device slot or password/recovery) to
    // catch a migration that was interrupted by a prior crash — the keyring
    // already exists at that point, so detectVaultState() alone can't tell.
    async function resumeMigrationIfNeeded() {
      if (!(await hasUnsealedRecords())) return;
      vaultState.value = 'migrating';
      try {
        await sealRemainingPlaintextRecords((table, count) => { migrationProgress.value = `${table}: ${count} records`; });
      } catch (err) {
        migrationError.value = err.message;
        vaultState.value = 'migration-failed';
        throw err;
      }
    }

    async function initVault() {
      const state = await detectVaultState();
      if (state === 'first-run') {
        vaultState.value = 'first-run';
      } else if (state === 'migrate') {
        vaultState.value = 'migrating';
        try {
          await migratePlaintextDatabase((table, count) => { migrationProgress.value = `${table}: ${count} records`; });
          await afterUnlock();
        } catch (err) {
          migrationError.value = err.message;
          vaultState.value = 'migration-failed';
        }
      } else if (state === 'auto-unlock') {
        const kr = await loadKeyring();
        await unlockWithDeviceSlot(kr);
        try {
          await resumeMigrationIfNeeded();
        } catch { return; }
        await afterUnlock();
      } else {
        vaultState.value = 'locked';
      }
    }

    async function continueWithoutPassword() {
      await createKeyringNoPassword();
      await afterUnlock();
    }

    async function submitFirstRunSetPassword() {
      securityForm.error = '';
      if (securityForm.newPassword !== securityForm.confirmPassword) { securityForm.error = 'Passwords do not match'; return; }
      try {
        validatePasswordLength(securityForm.newPassword);
        const msBytes = randomBytes(32);
        const kid = crypto.randomUUID();
        const recoveryKey = generateRecoveryKey();
        const passwordSlot = await buildSecretSlot('password', securityForm.newPassword, msBytes);
        const recoverySlot = await buildSecretSlot('recovery', recoveryKey, msBytes);
        await saveKeyring({ kid, slots: [passwordSlot, recoverySlot] });
        await deriveVaultKeys(msBytes, kid);
        securityForm.newPassword = ''; securityForm.confirmPassword = '';
        recoveryKeyDisplay.value = recoveryKey;
        vaultState.value = 'show-recovery';
      } catch (err) {
        securityForm.error = err.message;
      }
    }

    async function finishFirstRunRecovery() {
      recoveryKeyDisplay.value = null;
      await afterUnlock();
    }

    async function submitUnlock() {
      unlockError.value = '';
      try {
        const kr = await loadKeyring();
        const ok = await unlockWithSecret(kr, unlockSecret.value);
        if (!ok) { unlockError.value = 'Incorrect password or recovery key'; return; }
        unlockSecret.value = '';
        try {
          await resumeMigrationIfNeeded();
        } catch { return; }
        await afterUnlock();
      } catch (err) {
        unlockError.value = err.message;
      }
    }

    async function submitSetPassword() {
      securityForm.error = '';
      if (securityForm.newPassword !== securityForm.confirmPassword) { securityForm.error = 'Passwords do not match'; return; }
      try {
        const recoveryKey = await setPassword(securityForm.newPassword);
        hasPasswordProtection.value = true;
        securityForm.newPassword = ''; securityForm.confirmPassword = '';
        recoveryKeyDisplay.value = recoveryKey;
        resetIdleTimer();
      } catch (err) {
        securityForm.error = err.message;
      }
    }

    async function submitChangePassword() {
      securityForm.error = '';
      if (securityForm.newPassword !== securityForm.confirmPassword) { securityForm.error = 'Passwords do not match'; return; }
      try {
        await changePassword(securityForm.currentSecret, securityForm.newPassword);
        securityForm.currentSecret = ''; securityForm.newPassword = ''; securityForm.confirmPassword = '';
        showToast('Password changed');
      } catch (err) {
        securityForm.error = err.message;
      }
    }

    async function submitRemovePassword() {
      securityForm.error = '';
      try {
        await removePassword(securityForm.removePasswordSecret);
        securityForm.removePasswordSecret = '';
        hasPasswordProtection.value = false;
        clearIdleTimer();
        showToast('Password removed');
      } catch (err) {
        securityForm.error = err.message;
      }
    }

    async function submitRegenerateRecoveryKey() {
      securityForm.error = '';
      try {
        recoveryKeyDisplay.value = await regenerateRecoveryKey(securityForm.regenerateSecret);
        securityForm.regenerateSecret = '';
      } catch (err) {
        securityForm.error = err.message;
      }
    }

    function copyRecoveryKey() {
      navigator.clipboard.writeText(recoveryKeyDisplay.value);
      showToast('Recovery key copied');
    }

    function downloadRecoveryKey() {
      const blob = new Blob([recoveryKeyDisplay.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'calyx-recovery-key.txt'; a.click();
      URL.revokeObjectURL(url);
    }

    function promptImportSecret(kind) {
      return new Promise(resolve => {
        importSecretPrompt.value = { kind, value: '', resolve: (val) => { importSecretPrompt.value = null; resolve(val || null); } };
      });
    }

    function promptExportPasswordFn() {
      return new Promise(resolve => {
        exportPasswordPrompt.value = { value: '', resolve: (val) => { exportPasswordPrompt.value = null; resolve(val || null); } };
      });
    }

    provide('security', {
      hasPasswordProtection, recoveryKeyDisplay, securityForm,
      submitSetPassword, submitChangePassword, submitRemovePassword, submitRegenerateRecoveryKey,
      copyRecoveryKey, downloadRecoveryKey
    });

    onMounted(async () => {
      await loadPreUnlockTheme();
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/legacy/build/pdf.worker.min.js';
      }
      ['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => window.addEventListener(evt, resetIdleTimer, { passive: true }));
      await initVault();
    });

    return {
      settings, showSettings, settingsSection, sidebarOpen, searchQuery, toasts, memoryCategories,
      chats, chatIds, profiles, currentChatId, currentChat, messages,
      groupedChats, currentSessionInfo,
      chatMemories, chatMemoriesDesc, currentSegments, showSegmentsViewer, compacting,
      streaming, streamingContent, streamingDisplay, inputText, attachments,
      chatFiles, chatFilesTokens, pendingDocIds,
      editingTitle, titleDraft, titleInput, messageStream, inputArea, fileInput,
      showMemoryPanel, memoryTab, profileMemoriesList, editingMemoryId, memoryDraft,
      newMemoryCategory, newMemoryWhen, newMemoryContent,
      showProfileEditor, editingProfile, profileNameDraft, profilePromptDraft, profileDeleteAlsoChats,
      showImportModal, importMode, importFileInput,
      saveSetting, toggleTheme,
      createChat, selectChat, renameChat, togglePin, deleteChat,
      createBranchSession, dismissSessionProposal,
      startEditTitle, commitTitle, exportData,
      openProfileEditor, saveProfile, deleteProfileConfirm, setChatProfile, refreshProfileDigests,
      toggleMemoryPanel, addManualMemory, startEditMemory, commitMemoryEdit, toggleMemoryPin, deleteMemory,
      refreshProfileMemoriesList, compactNow,
      triggerImportInput, handleImportFile, cancelImport, confirmImport,
      sendMessage, triggerFileInput, handleFiles, removeAttachment, removeChatFile, autoResizeInput,
      renderMarkdown, fmtLocal,
      vaultState, migrationProgress, migrationError, unlockSecret, unlockError,
      showFirstRunPasswordForm, recoveryKeyDisplay, securityForm,
      hasPasswordProtection, importSecretPrompt, exportPasswordPrompt, minPasswordLength,
      continueWithoutPassword, submitFirstRunSetPassword, finishFirstRunRecovery, submitUnlock,
      submitSetPassword, submitChangePassword, submitRemovePassword, submitRegenerateRecoveryKey,
      copyRecoveryKey, downloadRecoveryKey, promptImportSecret, promptExportPasswordFn, lockVaultNow
    };
  }
});

app.component('icon', IconComponent);
app.component('settings-modal', SettingsModal);
app.component('chat-list-item', ChatListItem);
app.component('message-bubble', MessageBubble);
app.mount('#app');
</script>
</body>
</html>
